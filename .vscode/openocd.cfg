# OpenOCD config for MSPM0G3507 via CMSIS-DAP (debug only, no flash driver)
source [find interface/cmsis-dap.cfg]
adapter speed 1000
transport select swd

set CHIPNAME mspm0g3507
set _TARGETNAME $CHIPNAME.cpu

swj_newdap $CHIPNAME cpu -expected-id 0x6BA02477
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x2000 -work-area-backup 0

cortex_m reset_config sysresetreq

# Initialize on connect
$_TARGETNAME configure -event reset-init {
    adapter speed 1000
}
